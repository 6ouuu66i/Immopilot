function closeFiche() {
  document.getElementById('app').classList.remove('with-fiche');
  document.getElementById('toggle-label').textContent = 'Ouvrir mini fiche';
  SELECTED_PROP_ID = null;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active-selection'));
}

function toggleFiche() {
  const app = document.getElementById('app');
  app.classList.toggle('with-fiche');
  const isOpened = app.classList.contains('with-fiche');
  document.getElementById('toggle-label').textContent = isOpened ? 'Fermer mini fiche' : 'Ouvrir mini fiche';
  
  if (isOpened && SELECTED_PROP_ID === null) {
    openFiche();
  }
}

document.getElementById('search').addEventListener('input', e => { SEARCH = e.target.value; PAGE = 1; render(); });
document.getElementById('sort').addEventListener('change', e => { SORT = e.target.value; PAGE = 1; render(); });

// Advanced local filters listeners
var filterCityEl = document.getElementById('filter-city');
var filterSourceEl = document.getElementById('filter-source');
var filterTagEl = document.getElementById('filter-tag');
var filterFavBtnEl = document.getElementById('filter-fav-btn');
var filterResetEl = document.getElementById('filter-reset');

if (filterCityEl) {
  filterCityEl.addEventListener('change', e => {
    FILTER_CITY = e.target.value;
    PAGE = 1;
    render();
  });
}
if (filterSourceEl) {
  filterSourceEl.addEventListener('change', e => {
    FILTER_SOURCE = e.target.value;
    PAGE = 1;
    render();
  });
}
if (filterTagEl) {
  filterTagEl.addEventListener('change', e => {
    FILTER_TAG = e.target.value;
    PAGE = 1;
    render();
  });
}
if (filterFavBtnEl) {
  filterFavBtnEl.addEventListener('click', () => {
    FILTER_FAV = !FILTER_FAV;
    filterFavBtnEl.classList.toggle('active', FILTER_FAV);
    
    // Aesthetic hand-sketch active styles
    filterFavBtnEl.style.background = FILTER_FAV ? 'var(--forest-soft)' : 'white';
    filterFavBtnEl.style.color = FILTER_FAV ? 'var(--forest)' : 'var(--stone)';
    filterFavBtnEl.style.borderColor = FILTER_FAV ? 'var(--forest)' : 'var(--stone)';
    
    const svgEl = filterFavBtnEl.querySelector('svg');
    if (svgEl) {
      svgEl.setAttribute('fill', FILTER_FAV ? 'currentColor' : 'none');
    }
    PAGE = 1;
    render();
  });
}
if (filterResetEl) {
  filterResetEl.addEventListener('click', () => {
    FILTER_CITY = '';
    FILTER_SOURCE = '';
    FILTER_TAG = '';
    FILTER_FAV = false;
    SEARCH = '';
    
    if (filterCityEl) filterCityEl.value = '';
    if (filterSourceEl) filterSourceEl.value = '';
    if (filterTagEl) filterTagEl.value = '';
    document.getElementById('search').value = '';
    
    if (filterFavBtnEl) {
      filterFavBtnEl.classList.remove('active');
      filterFavBtnEl.style.background = 'white';
      filterFavBtnEl.style.color = 'var(--stone)';
      filterFavBtnEl.style.borderColor = 'var(--stone)';
      const svgEl = filterFavBtnEl.querySelector('svg');
      if (svgEl) {
        svgEl.setAttribute('fill', 'none');
      }
    }
    
    PAGE = 1;
    render();
  });
}

window.closeGrandeFiche = function() {
  const modal = document.getElementById('grande-fiche-modal');
  if (modal) {
    modal.classList.remove('open');
  }
  ACTIVE_GF_ID = null;
};

// Toggle checklist items in Grande Fiche (Not used in layout but preserved for safety)
window.toggleGrandeFicheCheck = function(idx) {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  p.checkedDocs[idx] = !p.checkedDocs[idx];
  localStorage.setItem(`immo_docs_prop_${p.id}`, JSON.stringify(p.checkedDocs));
  
  window.openGrandeFiche(p.id);
};

// Gallery navigation inside Grande Fiche
window.selectGrandeFichePhoto = function(idx) {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  ACTIVE_GF_PHOTO_INDEX = idx;
  const mainImg = document.getElementById('gf-main-img');
  if (mainImg) {
    mainImg.style.opacity = '0.3';
    setTimeout(() => {
      mainImg.src = p.photos[idx];
      mainImg.style.opacity = '1';
    }, 150);
  }
  
  const counter = document.getElementById('gf-gallery-counter');
  if (counter) {
    counter.textContent = `${idx + 1} / ${p.photos.length}`;
  }
  
  document.querySelectorAll('#grande-fiche-modal .hero-thumb').forEach((thumb) => {
    const thumbIdx = parseInt(thumb.getAttribute('data-index'), 10);
    thumb.classList.toggle('active', thumbIdx === idx);
  });
};

window.changeGrandeFichePhoto = function(dir) {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  const nextIdx = (ACTIVE_GF_PHOTO_INDEX + dir + p.photos.length) % p.photos.length;
  window.selectGrandeFichePhoto(nextIdx);
};

// Save a visitor note
window.saveGrandeFicheNote = function() {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  const input = document.getElementById('gf-note-input-field');
  if (!input) return;
  
  const text = input.value.trim();
  if (!text) {
    alert("Veuillez saisir des notes de visite ou d'évaluation avant d'enregistrer.");
    return;
  }
  
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-BE') + ' à ' + now.toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
  
  p.notes.push({ text: text, date: dateStr });
  localStorage.setItem(`immo_notes_prop_${p.id}`, JSON.stringify(p.notes));
  
  // Clear input
  input.value = '';
  
  // Re-run openGrandeFiche to update log history seamlessly without losing modal layout context!
  window.openGrandeFiche(p.id);
};

// Delete a visitor note
window.deleteGrandeFicheNote = function(noteIdx) {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  p.notes.splice(noteIdx, 1);
  localStorage.setItem(`immo_notes_prop_${p.id}`, JSON.stringify(p.notes));
  
  window.openGrandeFiche(p.id);
};

// Print / PDF brochure downloader
window.printGrandeFiche = function() {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  const dlText = document.getElementById('lbl-pdf-dl');
  if (dlText) {
    dlText.textContent = "Génération...";
  }
  
  setTimeout(() => {
    if (dlText) {
      dlText.textContent = "Téléchargé ✔";
    }
    alert(`Succès : Le dossier d'évaluation technique officiel imprimable pour "${p.title}" (${p.city}) a été généré et enregistré au format PDF dans votre dossier de téléchargements !`);
    
    setTimeout(() => {
      if (dlText) {
        dlText.textContent = "Copie PDF";
      }
    }, 2500);
  }, 1200);
};

// Deal placement transition to Pipeline boards
window.createGrandeFicheDeal = function() {
  const p = PROPS.find(item => item.id === ACTIVE_GF_ID);
  if (!p) return;
  
  alert(`Coup de crayon réussi ! Un nouveau Deal CRM vient d'être initié à l'étape [Prospection Évaluation] pour le bien "${p.title}" au prix de ${new Intl.NumberFormat('fr-BE', {style:'currency', currency:'EUR', maximumFractionDigits:0}).format(p.price)} !\n\nVous allez être redirigé vers le Pipeline CRM.`);
  
  window.location.hash = '#pipeline';
  window.closeGrandeFiche();
};

render();
</script>
