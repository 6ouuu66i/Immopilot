<script>
(function() {
  const store = window.ImmoPilotStore;
  if (!store) return;

  // Track state locally
  let selectedTransferTab = 'tous'; 
  let selectedAgentKPI = 'global';

  // Local state for portal sync sources to simulate real-time API integrations
  let portalSyncStates = {
    'Immoweb': { status: 'synced', text: '✔ Sync', lastTime: '09:42', count: 28734, color: '#2B3A8C', initials: 'iw' },
    'Zimmo': { status: 'synced', text: '✔ Sync', lastTime: '09:40', count: 19872, color: 'var(--forest)', initials: 'zi' },
    'Immovlan': { status: 'synced', text: '✔ Sync', lastTime: '09:39', count: 12104, color: '#8F55C9', initials: 'im' },
    '2ememain': { status: 'warning', text: '⚠ Alerte', lastTime: '08:10', count: 6120, color: '#C67A13', initials: '2e' },
    'Biddit': { status: 'error', text: '✖ Erreur', lastTime: 'Hier', count: 418, color: '#C0553D', initials: 'bi' }
  };

  function renderAdminView() {
    const mainView = document.getElementById('admin-interactive-view');
    const roleIndicator = document.getElementById('admin-main-role-indicator');
    if (!mainView) return;

    const currentAgent = store.getCurrentAgent();
    const isAdmin = currentAgent.role === 'admin';

    // 1. Update Role Indicator style
    if (roleIndicator) {
      roleIndicator.textContent = isAdmin ? 'Portail Administrateur Garanti' : 'Vue Restreinte — Admin uniquement';
      roleIndicator.className = isAdmin ? 'status-badge status-payable' : 'status-badge status-brouillon';
    }

    // 2. Restricted View for non-admin profiles
    if (!isAdmin) {
      mainView.innerHTML = `
        <div class="admin-restricted-box">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#C0553D" stroke-width="2" style="margin: 0 auto 16px;">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <h2 style="font-family:'Lora',serif; font-size:19px; font-weight:800; margin-bottom:10px; color:var(--ink);">Accès Administratif Protégé</h2>
          <p style="font-size:13px; color:var(--stone); margin-bottom:20px; line-height:1.55;">
            Thomas Martin, vous êtes actuellement authentifié en tant que <b>Conseiller de terrain</b>. Les tableaux de synthèses de l'agence, l'audit-log d'activité et la configuration des automatisations exigent un profil d'administrateur.
          </p>
          <button class="thick-btn-action" style="max-width:320px; margin: 0 auto;" onclick="forceSwitchToAdminSarah()">
            Basculer sur le profil de Sarah (Admin)
          </button>
        </div>
      `;
      return;
    }

    // Load elements from global store database
    const properties = store.getProperties();
    const deals = store.getDeals();
    const commissions = store.getCommissions();
    const transfers = store.getTransfers();

    // Sum calculation for KPI Cards dynamically filtered by agent
    let kpiCA = 3845000;
    let kpiComs = 142350;
    let kpiBiensActifs = 38;
    let kpiVentesConclues = 22;
    let subTrendCA = "+ 520 000 € ce mois";
    let subTrendComs = "+ 18 420 € ce mois";
    let subTrendBiensActifs = "+ 6 ce mois";
    let subTrendVentesConclues = "+ 4 ce mois";
    let activeAgentName = "Global Agence";

    if (selectedAgentKPI === 'lucas') {
      kpiCA = 1850000;
      kpiComs = 42850;
      kpiBiensActifs = 15;
      kpiVentesConclues = 8;
      subTrendCA = "Lucas - Top Vendeur de l'agence";
      subTrendComs = "Lucas - 42.850 € cumulés";
      subTrendBiensActifs = "Lucas - Bruxelles & Brabant";
      subTrendVentesConclues = "Lucas - 8 ventes bouclées";
      activeAgentName = "Lucas Martin";
    } else if (selectedAgentKPI === 'sarah') {
      kpiCA = 1310000;
      kpiComs = 31240;
      kpiBiensActifs = 12;
      kpiVentesConclues = 6;
      subTrendCA = "Sarah - Volume d'agence";
      subTrendComs = "Sarah - 31.240 € ouverts";
      subTrendBiensActifs = "Sarah - Uccle & Ixelles";

  // Interactivity to filter and manage transfers list
  window.setTransferTab = function(status) {
    selectedTransferTab = status;
    
    // Update active UI classes of tabs
    const buttons = ['tous', 'en_attente', 'accepte', 'refuse'];
    buttons.forEach(btnKey => {
      const el = document.getElementById('tab-tr-' + btnKey);
      if (el) {
        if (btnKey === status) el.classList.add('active');
        else el.classList.remove('active');
      }
    });

    renderTransfersGrid();
  };

  function renderTransfersGrid() {
    const tableBody = document.getElementById('transfer-requests-table-body');
    if (!tableBody) return;

    const transfers = store.getTransfers();
    const agents = store.getAgents();
    const properties = store.getProperties();

    // High fidelity counter values in tabs from both store and screenshot defaults
    const pendingTrans = transfers.filter(x => x.status === 'en_attente');
    const acceptedTrans = transfers.filter(x => x.status === 'accepté');
    const rejectedTrans = transfers.filter(x => x.status === 'refusé');

    const totalCounter = 16 + transfers.length; 
    
    // Safety check on elements existence before updating text
    const allEl = document.getElementById('cnt-tr-all');
    if (allEl) allEl.textContent = totalCounter;
    const pendEl = document.getElementById('cnt-tr-pending');
    if (pendEl) pendEl.textContent = pendingTrans.length;
    const accEl = document.getElementById('cnt-tr-accepted');
    if (accEl) accEl.textContent = 10 + acceptedTrans.length;
    const rejEl = document.getElementById('cnt-tr-rejected');
    if (rejEl) rejEl.textContent = 6 + rejectedTrans.length;

    // Filter requests
    let filteredList = [...transfers];
    if (selectedTransferTab === 'en_attente') {
      filteredList = transfers.filter(tr => tr.status === 'en_attente');
    } else if (selectedTransferTab === 'accepte') {
      filteredList = transfers.filter(tr => tr.status === 'accepté');
    } else if (selectedTransferTab === 'refuse') {
      filteredList = transfers.filter(tr => tr.status === 'refusé');
    }

    // Baseline historical requests to populate beautiful image contents
    const baseHistorical = [
      {
        id: 'hist-1',
        title: 'Maison 4 façades',
        city: 'Wavre',
        photo: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=100&q=80',
        from: 'Sarah V.',
        to: 'Lucas M.',
        reason: 'Client demande Lucas',
        status: 'accepté',
        date: '2026-05-24'
      },
      {
        id: 'hist-2',
        title: 'Penthouse 3 ch.',
        city: 'Uccle',
        photo: 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=100&q=80',
        from: 'Adam D.',
        to: 'Sarah V.',
        reason: 'Surcharge planning',
        status: 'refusé',
        date: '2026-05-23'
      }
    ];

    let renderRows = [];

    // Map the active ones from store
    filteredList.forEach(tr => {
      const propObj = properties.find(p => p.id === tr.propertyId);
      const fromAg = agents.find(a => a.id === tr.fromAgentId)?.name || 'Lucas M.';
      const toAg = agents.find(a => a.id === tr.toAgentId)?.name || 'Sarah V.';
      
      const initialsFrom = fromAg.split(' ').map(s=>s[0]).join('') + '.';
      const initialsTo = toAg.split(' ').map(s=>s[0]).join('') + '.';

      renderRows.push({
        id: tr.id,
        title: propObj ? propObj.title : 'Bien Immo',
        city: propObj ? propObj.city : 'Belgique',
        photo: propObj && propObj.photos && propObj.photos[0] ? propObj.photos[0] : 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=100&q=80',
        from: initialsFrom,
        to: initialsTo,
        reason: 'Attribution secteur',
        status: tr.status,
        date: tr.date,
        actionable: tr.status === 'en_attente'
      });
    });

    // Merge high fidelity mock baselines if showing tous / applicable tab
    baseHistorical.forEach(hist => {
      if (selectedTransferTab === 'tous' || selectedTransferTab === hist.status) {
         renderRows.push(hist);
      }
    });

    if (renderRows.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="7" style="text-align:center; color:var(--stone); padding: 24px; font-style: italic;">
            Aucune demande de transfert sous les filtres actifs.
          </td>
        </tr>
      `;
      return;
    }

    // Sort renderRows so that actionable/en_attente are consistently shown at the top
    renderRows.sort((a,b) => (b.status === 'en_attente' ? 1 : 0) - (a.status === 'en_attente' ? 1 : 0));

    tableBody.innerHTML = renderRows.map(row => {
      let statusMarkup = '';
      if (row.status === 'en_attente') {
        statusMarkup = '<span class="pill-status warning">En attente</span>';
      } else if (row.status === 'accepté') {
        statusMarkup = '<span class="pill-status synced">Accepté</span>';
      } else if (row.status === 'refusé') {
        statusMarkup = '<span class="pill-status error">Refusé</span>';
      }

      const actionsMarkup = row.actionable ? `
        <div style="display:flex; gap:6.5px; justify-content:flex-end;">
          <!-- Custom green check tick circle -->
          <button onclick="event.stopPropagation(); executeActionDecision('${row.id}', 'accepté')" style="width:26px; height:26px; border-radius:6px; background:#EBF7EE; border:1px solid var(--forest); color:var(--forest); font-weight:bold; cursor:pointer;" title="Accepter le transfert">✔</button>
          
          <!-- Custom red cross circle -->
          <button onclick="event.stopPropagation(); executeActionDecision('${row.id}', 'refusé')" style="width:26px; height:26px; border-radius:6px; background:#FCECE9; border:1px solid #C0553D; color:#C0553D; font-weight:bold; cursor:pointer;" title="Rejeter le transfert">✕</button>
        </div>
      ` : `<span style="font-size:11px; color:var(--stone-light);">Traité</span>`;

      return `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <img src="${row.photo}" class="transfer-house-pic" />
              <div>
                <strong style="font-family:'Lora',serif; font-size:12.5px; color:var(--ink);">${row.title}</strong><br>
                <span style="font-size:10.5px; font-family:'JetBrains Mono',monospace; color:var(--stone-light);">${row.city}</span>
              </div>
            </div>
          </td>
          <td style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;">${row.from}</td>
          <td style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;">${row.to}</td>
          <td style="color:var(--stone); font-size:11.5px;">${row.reason}</td>
          <td>${statusMarkup}</td>
          <td style="font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--stone-light);">${row.date}</td>
          <td>${actionsMarkup}</td>
        </tr>
      `;
    }).join('');
  }

  // Portal Synchronization Interactive simulation
  window.syncSourcePortal = function(portalName) {
    if (!portalSyncStates[portalName]) return;
    
    // Spawn loader state
    portalSyncStates[portalName].status = 'syncing';
    portalSyncStates[portalName].text = '🔄 Synchro...';
    renderAdminView();

    setTimeout(() => {
      portalSyncStates[portalName].status = 'synced';
      portalSyncStates[portalName].text = '✔ Sync';
      
      const now = new Date();
      const formatTime = (now.getHours() < 10 ? '0' : '') + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
      portalSyncStates[portalName].lastTime = formatTime;
      portalSyncStates[portalName].count += Math.floor(Math.random() * 30) + 5; // dynamic update count

      // Dispatch feedback and toast
      const t = document.createElement('div');
      t.style.cssText = "position:fixed; bottom:24px; right:24px; background:#FFFFFF; color:var(--ink); border:2px solid var(--ink); padding:14px 22px; border-radius:180px 15px 150px 15px/15px 150px 15px 180px; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700; box-shadow:4px 4px 0 var(--forest); z-index:9999;";
      t.textContent = `PORTAIL SYNC : ${portalName.toUpperCase()} a synchronisé son API avec succès.`;
      document.body.appendChild(t);
      setTimeout(() => { t.remove(); }, 2500);

      renderAdminView();
    }, 1200);
  };

  // --- Pipeline Stage Editor Interactivity ---
  window.movePipelineStage = function(idx, direction) {
    if (!store.getPipelineStages || !store.savePipelineStages) return;
    const stages = store.getPipelineStages();
    
    if (direction === -1 && idx > 0) {
      const temp = stages[idx];
      stages[idx] = stages[idx - 1];
      stages[idx - 1] = temp;
    } else if (direction === 1 && idx < stages.length - 1) {
      const temp = stages[idx];
      stages[idx] = stages[idx + 1];
      stages[idx + 1] = temp;
    }
    
    store.savePipelineStages(stages);
    renderAdminView();
    
    // Throw state changed notification bubble
    const t = document.createElement('div');
    t.style.cssText = "position:fixed; bottom:24px; right:24px; background:#FFFFFF; color:var(--ink); border:2px solid var(--ink); padding:12px 18px; border-radius:8px; font-family:'JetBrains Mono'; font-size:11px; font-weight:700; box-shadow:3px 3px 0 var(--forest); z-index:9999;";
    t.textContent = `PIPELINE : Ordre des étapes mis à jour !`;
    document.body.appendChild(t);
    setTimeout(() => { t.remove(); }, 1800);
  };

    const stages = store.getPipelineStages();
    if (stages.length <= 4) {
      alert("Erreur de sécurité : Il faut conserver au moins 4 étapes de qualification pour la fluidité du CRM d'agence.");
      return;
    }

    const name = stages[idx].name;
    if (confirm(`Confirmer la suppression irréversible de l'étape : "${name}" ?`)) {
       stages.splice(idx, 1);
       store.savePipelineStages(stages);
       renderAdminView();
    }
  };

  window.addNewPipelineStage = function() {
    const input = document.getElementById('new-stage-title-input');
    if (!input) return;
    const value = input.value.trim();
    if (!value) {
      alert("Veuillez saisir un intitulé pour la nouvelle étape.");
      return;
    }

    if (!store.getPipelineStages || !store.savePipelineStages) return;
    const stages = store.getPipelineStages();
    
    // Append object
    const colorCodes = ['#C67A13', 'var(--forest)', '#2B3A8C', '#8F55C9', '#C0553D'];
    const randomColor = colorCodes[Math.floor(Math.random() * colorCodes.length)];
    
    stages.push({
      id: 'custom_' + Date.now(),
      name: value,
      icon: '✦',
      color: randomColor
    });

    store.savePipelineStages(stages);
    input.value = '';
    renderAdminView();

    // Success notify
    const t = document.createElement('div');
    t.style.cssText = "position:fixed; bottom:24px; right:24px; background:#FFFFFF; color:var(--ink); border:2px solid var(--ink); padding:12px 18px; border-radius:8px; font-family:'JetBrains Mono'; font-size:11px; font-weight:700; box-shadow:3px 3px 0 var(--forest); z-index:9999;";
    t.textContent = `ÉTAPE CRÉÉE : "${value}" est désormais active dans le pipeline !`;
    document.body.appendChild(t);
    setTimeout(() => { t.remove(); }, 2000);
  };

  window.resetPipelineStagesToDefault = function() {
    if (!confirm("Voulez-vous réinitialiser le workflow de l'agence aux 8 phases d'origine ?")) return;
    localStorage.removeItem('ip_pipeline_stages');
    // Dispatch general triggers
    if (window.ImmoPilotStore && window.ImmoPilotStore.createAuditLog) {
      window.ImmoPilotStore.createAuditLog('Admin Configuration', 'Les étapes du pipeline ont été réinitialisées par défaut.');
    }
    window.dispatchEvent(new CustomEvent('ip-state-changed'));
    renderAdminView();
  };

  // Agent KPI Isolation Trigger Click
  window.selectAgentKPI = function(agentId) {
    if (selectedAgentKPI === agentId) {
      selectedAgentKPI = 'global';
    } else {
      selectedAgentKPI = agentId;
    }
    renderAdminView();
  };

  window.scrollToElement = function(elementId) {
    const el = document.getElementById(elementId);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  };

  // Run immediately
  renderAdminView();

  // Re-run if store notifies changes (agents switch, state saves, etc.)
  window.addEventListener('ip-agent-changed', renderAdminView);
  window.addEventListener('ip-state-changed', renderAdminView);
})();
</script>
