name: CI

on:
  pull_request:
  push:
    branches:
      - skeleton-review
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate workflow syntax
        run: npm run ci:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint compatibility check
        run: npm run lint

      - name: Run deterministic tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload Playwright failure report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            !test-results/**/storage-state*
            !test-results/**/*.env
            !test-results/**/*.db
            !test-results/**/*.sqlite*
          if-no-files-found: ignore
          retention-days: 7

  authenticated-e2e:
    name: Authenticated E2E (manual only)
    if: github.event_name == 'workflow_dispatch'
    needs: deterministic-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_AUTH_RUN: 'true'
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required secrets
        shell: bash
        run: |
          missing=()
          for name in E2E_EMAIL E2E_PASSWORD VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated E2E
        run: npm run test:e2e:auth
