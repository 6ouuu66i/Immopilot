name: Cutover schema proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cutover-schema-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-proof:
    name: Read-only schema dump and restore proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cutover-schema-readonly
    env:
      CI: 'true'
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify proof contracts
        run: |
          test "$(./node_modules/.bin/supabase --version)" = "2.109.1"
          node scripts/database/cutover-proof/contracts.mjs
          node --test scripts/database/cutover-proof/scan-dump.test.mjs

      - name: Apply proof compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/database/cutover-proof/fingerprint.sql')
          text = path.read_text()
          replacements = [
              ("d.defaclobjtype,", "d.defaclobjtype::text,"),
              ("'auth_schema', to_regnamespace('auth') IS NOT NULL,", "'auth_schema', EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='auth'),"),
              ("'auth_users_table', to_regclass('auth.users') IS NOT NULL,", "'auth_users_table', EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='auth' AND c.relname='users'),"),
              ("FROM pg_trigger t WHERE t.tgrelid=to_regclass('auth.users') AND NOT t.tgisinternal", "FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='auth' AND c.relname='users' AND NOT t.tgisinternal"),
              ("'storage_schema', to_regnamespace('storage') IS NOT NULL,", "'storage_schema', EXISTS (SELECT 1 FROM pg_namespace WHERE nspname='storage'),"),
              ("'storage_buckets_table', to_regclass('storage.buckets') IS NOT NULL,", "'storage_buckets_table', EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='storage' AND c.relname='buckets'),"),
              ("'storage_objects_table', to_regclass('storage.objects') IS NOT NULL,", "'storage_objects_table', EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='storage' AND c.relname='objects'),"),
              ("'cron_jobs_table', to_regclass('cron.job') IS NOT NULL,", "'cron_jobs_table', EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='cron' AND c.relname='job'),"),
              ("'vault_secrets_table', to_regclass('vault.secrets') IS NOT NULL", "'vault_secrets_table', EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='vault' AND c.relname='secrets')"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected fingerprint fragment: {old}')
              text = text.replace(old, new)
          path.write_text(text)

          run_proof_path = Path('scripts/database/cutover-proof/run-proof.sh')
          run_proof = run_proof_path.read_text()

          marker = '# Runner-only worktree preparation: legacy migrations leave the active path only here.'
          if marker not in run_proof:
              raise SystemExit('missing local proof transition marker')
          run_proof = run_proof.replace(marker, 'unset DATABASE_URL PGOPTIONS\n\n' + marker, 1)

          default_privileges = '''psql "$local_db_url" -X -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public'''
          if default_privileges not in run_proof:
              raise SystemExit('missing local default privileges block')
          extension_prep = '''psql "$local_db_url" -X -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
          WITH required(extname) AS (VALUES ('pg_trgm'), ('unaccent'))
          SELECT CASE
            WHEN e.oid IS NULL THEN format('CREATE EXTENSION %I WITH SCHEMA public', r.extname)
            ELSE format('ALTER EXTENSION %I SET SCHEMA public', r.extname)
          END
          FROM required r
          LEFT JOIN pg_extension e ON e.extname = r.extname
          LEFT JOIN pg_namespace n ON n.oid = e.extnamespace
          WHERE e.oid IS NULL OR n.nspname <> 'public'
          \\gexec
          SQL

          '''
          run_proof = run_proof.replace(default_privileges, extension_prep + default_privileges, 1)

          restore_command = '''set +e
          psql "$local_db_url" -X -v ON_ERROR_STOP=1 --single-transaction'''
          if restore_command not in run_proof:
              raise SystemExit('missing local restore command')
          restore_prep = '''restore_input="$raw_dir/public-schema-restore.sql"
          managed_default_privileges="$raw_dir/supabase-admin-default-privileges.sql"
          sed -n '/^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public /p' \
            "$artifact_dir/public-schema-current.sql" >"$managed_default_privileges"
          sed \
            -e '/^CREATE SCHEMA public;$/d' \
            -e '/^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public /d' \
            "$artifact_dir/public-schema-current.sql" >"$restore_input"

          '''
          run_proof = run_proof.replace(restore_command, restore_prep + restore_command, 1)

          restore_path = '-f "$artifact_dir/public-schema-current.sql"'
          if restore_path not in run_proof:
              raise SystemExit('missing local restore input path')
          run_proof = run_proof.replace(restore_path, '-f "$restore_input"', 1)

          restore_result = '''  >"$raw_dir/restore.raw" 2>&1
          restore_status=$?
          set -e'''
          if restore_result not in run_proof:
              raise SystemExit('missing local restore result block')
          managed_default_restore = '''  >"$raw_dir/restore.raw" 2>&1
          restore_status=$?
          if (( restore_status == 0 )); then
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U supabase_admin -d postgres \
              -X -v ON_ERROR_STOP=1 --single-transaction \
              -f "$managed_default_privileges" \
              >>"$raw_dir/restore.raw" 2>&1
            restore_status=$?
          fi
          set -e'''
          run_proof = run_proof.replace(restore_result, managed_default_restore, 1)

          run_proof_path.write_text(run_proof)
          PY

      - name: Extract, restore, and compare schema
        id: proof
        env:
          CUTOVER_DATABASE_URL: ${{ secrets.CUTOVER_DATABASE_URL }}
        run: bash scripts/database/cutover-proof/run-proof.sh

      - name: Upload private temporary proof
        if: always() && steps.proof.outputs.artifact_safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-schema-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/cutover-schema-proof/artifacts/
          if-no-files-found: error
          retention-days: 1

      - name: Upload sanitized security finding only
        if: always() && steps.proof.outputs.security_report_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cutover-schema-security-report-${{ github.run_id }}
          path: ${{ runner.temp }}/cutover-schema-proof/security-report-only/
          if-no-files-found: error
          retention-days: 1
